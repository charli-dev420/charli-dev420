name: Temporary Hugging Face RGB export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-hf-rgb-export-main.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install downloader
        run: python -m pip install --disable-pip-version-check --quiet "huggingface_hub[hf_xet]>=0.34"

      - name: Build ZIP files
        shell: bash
        run: |
          cat > /tmp/export_hf_rgb.py <<'PY'
          from __future__ import annotations
          import hashlib
          import re
          import zipfile
          from pathlib import Path, PurePosixPath
          from huggingface_hub import HfApi, hf_hub_download
          from huggingface_hub.hf_api import RepoFile, RepoFolder

          REPO_ID = "fireviewer/dataset-from-simulations"
          REVISION = "main"
          ROOT = "massif-of-justin/sim/raw_files"
          OUTPUT = Path("hf_rgb_exports")
          OUTPUT.mkdir(parents=True, exist_ok=True)
          api = HfApi()

          def list_folders(path: str) -> list[str]:
              values = []
              for item in api.list_repo_tree(repo_id=REPO_ID, repo_type="dataset", revision=REVISION, path_in_repo=path, recursive=False, expand=False):
                  if isinstance(item, RepoFolder):
                      values.append(PurePosixPath(item.path).name)
              return sorted(set(values))

          targets = []
          for day in ("day01", "day02"):
              for case in list_folders(f"{ROOT}/{day}"):
                  if re.fullmatch(r"case\d+", case):
                      targets.append((day, case))
          targets.append(("day03", "case02"))
          targets = sorted(set(targets))
          if not targets:
              raise RuntimeError("No matching cases found")

          global_manifest = [
              f"repository={REPO_ID}",
              f"revision={REVISION}",
              "selection=all cases under day01 and day02, plus day03/case02",
              "selector=pointNN/original/rgb.png",
              "",
          ]

          for day, case in targets:
              case_root = f"{ROOT}/{day}/{case}"
              remote_files = []
              for item in api.list_repo_tree(repo_id=REPO_ID, repo_type="dataset", revision=REVISION, path_in_repo=case_root, recursive=True, expand=False):
                  if isinstance(item, RepoFile) and re.search(r"/point\d+/original/rgb\.png$", item.path):
                      remote_files.append(item.path)
              remote_files = sorted(set(remote_files))
              if not remote_files:
                  raise RuntimeError(f"No original RGB images found under {day}/{case}")

              zip_name = f"massif-of-justin_{day}_{case}_original_rgb_{len(remote_files)}points.zip"
              zip_path = OUTPUT / zip_name
              case_manifest = [f"case={day}/{case}", f"image_count={len(remote_files)}", ""]
              with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
                  for remote_path in remote_files:
                      point = PurePosixPath(remote_path).parts[-3]
                      local_path = Path(hf_hub_download(repo_id=REPO_ID, repo_type="dataset", revision=REVISION, filename=remote_path))
                      output_name = f"{day}_{case}_{point}_original_rgb.png"
                      digest = hashlib.sha256(local_path.read_bytes()).hexdigest()
                      archive.write(local_path, arcname=output_name)
                      case_manifest.append(f"{output_name}\tsha256={digest}\tsource={remote_path}")
                  archive.writestr("MANIFEST.txt", "\n".join(case_manifest) + "\n")

              zip_digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              global_manifest.append(f"{day}/{case}\timages={len(remote_files)}\tzip={zip_name}\tsha256={zip_digest}")
              print(f"Created {zip_name}: {len(remote_files)} images", flush=True)

          (OUTPUT / "EXPORT_MANIFEST.txt").write_text("\n".join(global_manifest) + "\n", encoding="utf-8")
          print((OUTPUT / "EXPORT_MANIFEST.txt").read_text(encoding="utf-8"), flush=True)
          PY
          python /tmp/export_hf_rgb.py

      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: massif-of-justin-original-rgb-exports
          path: hf_rgb_exports/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
